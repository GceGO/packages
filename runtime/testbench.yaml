# Used by Larastan (and `vendor/bin/testbench`) to boot the package with its providers,
# so namespaced package views ("gcego-runtime::...") are known during static analysis.
providers:
  - Gcego\Core\GcegoServiceProvider
  - Gcego\Registry\RegistryServiceProvider
  - Gcego\Blueprints\BlueprintsServiceProvider
  - Gcego\Runtime\RuntimeServiceProvider
